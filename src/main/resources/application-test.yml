# Test profile overrides — use H2, skip Flyway and Redis
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      enabled: false

resilience4j:
  circuitbreaker:
    instances: {}
  ratelimiter:
    instances: {}
  retry:
    instances: {}

# Test thresholds: 3 failed attempts per email, 5 per IP
auth:
  rate-limit:
    max-failed-attempts: 3
    max-attempts-per-ip: 5
    window-minutes: 15
    trust-forwarded-header: false
  email-limit:
    max-per-email: 3
    max-per-ip: 10
    window-minutes: 15
