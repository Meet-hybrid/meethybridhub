# ============================================================================
# MeethybridHub configuration
# Every secret / environment-specific value is an environment variable with a
# sensible local default — this file is safe to commit to version control.
# ============================================================================

spring:
  application:
    name: meethybridhub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meethybridhub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # NEVER use update/create in production. The schema's source of truth is
      # Flyway migrations (src/main/resources/db/migration). 'validate' makes
      # the app refuse to start if the DB doesn't match the entities — a safety net.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Enable JPA auditing (@CreatedDate, @LastModifiedDate)
  data:
    jpa:
      repositories:
        bootstrap-mode: default
      auditing:
        auditor-aware-ref: auditorAwareImpl

server:
  port: ${PORT:8080}

# Redis configuration (Phase 9: caching layer)
# In production, set SPRING_DATA_REDIS_URL or REDIS_URL.
# Local dev: run `docker run -d --name redis -p 6379:6379 redis:7-alpine`
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  timeout: ${REDIS_TIMEOUT:2000}

# Disable Redis auto-configuration when no Redis is available (CI, tests)
# Set SPRING_DATA_REDIS_ENABLED=true in production.
spring.autoconfigure:
  exclude:
    - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
    - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Resilience4j circuit breaker and rate limiter (Phase 9)
resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      externalApi:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      strict:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

# JWT Configuration
# IMPORTANT: In production, JWT_SECRET must be a securely generated random string
# of at least 32 characters, stored in environment variables or a secret manager.
jwt:
  secret: ${JWT_SECRET:changemeinproductionatleast32bytessecrethere}
  access-token:
    expiration-hours: ${JWT_ACCESS_EXPIRATION:24}
  refresh-token:
    expiration-days: ${JWT_REFRESH_EXPIRATION:30}

# Store / tenant configuration
# Base domain used by StoreFilter to resolve a tenant from the Host header
# (e.g. divine-signature.meethybridhub.com -> slug divine-signature).
store:
  base-domain: ${STORE_BASE_DOMAIN:meethybridhub.com}

# Payment provider webhook verification. Replace the local default in production.
payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}

# Public base URL used to build verification links in emails.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

# Login rate limiting / account lockout (see LoginAttemptService).
# The login_attempts table (V2) feeds these windowed counters.
auth:
  rate-limit:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}     # per email, per window
    max-attempts-per-ip: ${AUTH_MAX_ATTEMPTS_PER_IP:20}    # per IP, per window
    window-minutes: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
    # Trust X-Forwarded-For ONLY when the app sits behind YOUR reverse proxy;
    # otherwise clients can spoof the header and rotate IPs past the per-IP limit.
    trust-forwarded-header: ${AUTH_TRUST_FORWARDED_HEADER:false}

  # Email flooding protection for resend-verification / reset-password
  # (see LoginAttemptService). Recorded in the same login_attempts table under
  # purpose='EMAIL_SEND', sharing the 24h retention.
  email-limit:
    max-per-email: ${AUTH_MAX_EMAILS_PER_EMAIL:3}    # emails to one address, per window
    max-per-ip: ${AUTH_MAX_EMAILS_PER_IP:10}         # emails from one IP, per window
    window-minutes: ${AUTH_EMAIL_LIMIT_WINDOW_MINUTES:15}

# Email configuration (for verification and notifications)
mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
  from: ${MAIL_FROM:noreply@meethybridhub.com}

# Dormant platform-charge module (see docs/platform-charge-dormant-module.md).
# Ships ASLEEP: charge() and the nightly sweep are no-ops until enabled.
# Wake it with PLATFORM_CHARGE_ENABLED=true + PLATFORM_CHARGE_FLAT_FEE=<amount>
# (and a ChargeableTransactionSource implementation once Orders/Payments land).
platform-charge:
  enabled: ${PLATFORM_CHARGE_ENABLED:false}
  flat-fee: ${PLATFORM_CHARGE_FLAT_FEE:0}
  currency: ${PLATFORM_CHARGE_CURRENCY:NGN}
  sweep-cron: ${PLATFORM_CHARGE_SWEEP_CRON:0 0 3 * * *}

logging:
  level:
    root: INFO
    com.meethybridhub: DEBUG
    org.springframework.security: DEBUG
  pattern:
    # Logs are for machines too: ISO-8601 timestamps, level, thread, logger, message.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n"
